<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | Mis XV</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            background:
                linear-gradient(
                    rgba(5, 20, 45, 0.82),
                    rgba(5, 20, 45, 0.90)
                ),
                url("fondo.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            animation: aparecer 0.8s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,10,30,0.35);
            backdrop-filter: blur(8px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        nav {
            display: flex;
            gap: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 25px;
            transition: 0.3s;
        }

        nav a:hover {
            background: rgba(70,160,255,0.35);
            box-shadow: 0 0 15px rgba(80,180,255,0.3);
        }

        .contenido {
            padding: 60px 30px;
            text-align: center;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(70,180,255,0.8);
        }

        .descripcion {
            color: #d9ecff;
            margin-bottom: 40px;
            font-size: 18px;
        }

        .galeria {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            padding: 10px;
        }

        .foto {
            min-height: 250px;
            border-radius: 18px;
            background: rgba(30,100,170,0.25);
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            transition: transform 0.3s;
            box-shadow:
                0 0 8px rgba(255,255,255,0.9),
                0 0 20px rgba(255,255,255,0.55),
                0 0 35px rgba(255,255,255,0.25);
        }

        .foto:hover {
            transform: scale(1.03);
        }

        .foto img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            border-radius: 18px;
            cursor: pointer;
            box-shadow:
                0 0 10px rgba(255,255,255,0.9),
                0 0 25px rgba(255,255,255,0.5),
                0 0 45px rgba(255,255,255,0.2);
        }

        .sin-fotos {
            grid-column: 1 / -1;
            padding: 35px 20px;
            color: #eaf6ff;
            font-size: 18px;
            line-height: 1.6;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 18px;
            background: rgba(30,100,170,0.22);
            box-shadow:
                0 0 10px rgba(255,255,255,0.25),
                0 0 25px rgba(255,255,255,0.12);
        }

        .icono-camara {
            display: block;
            font-size: 38px;
            margin-bottom: 8px;
        }

        .subir {
            margin-top: 40px;
            padding: 14px 30px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.5);
            background: rgba(40,130,220,0.4);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .subir:hover {
            background: rgba(50,160,255,0.7);
            box-shadow: 0 0 20px rgba(80,180,255,0.5);
            transform: scale(1.05);
        }

        .subir:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .contenido {
                padding: 35px 15px;
            }

            h1 {
                font-size: 38px;
            }

            .descripcion {
                font-size: 16px;
            }

            .galeria {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">MIS XV</div>

        <nav>
            <a href="inicio.html">Inicio</a>
            <a href="galeria.html">Galería</a>
            <a href="mensajes.html">Mensajes</a>
        </nav>
    </header>

    <main class="contenido">
        <h1>Galería</h1>
        <p class="descripcion">
            Comparte los recuerdos de esta noche.
        </p>

        <div class="galeria" id="galeria">
            <div class="sin-fotos">
                <span class="icono-camara">📸</span>
                <div>Todavía no hay fotos.</div>
                <div>¡Sé el primero en subir una!</div>
            </div>
        </div>

        <input
            type="file"
            id="selectorFoto"
            accept="image/*"
            hidden
        >

        <button class="subir" id="botonSubir">
            + Subir una foto
        </button>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL =
            "https://mdyanimoegicpxjzawnu.supabase.co";

        const SUPABASE_KEY = "sb_publishable_ACMdOCrdlOUj9yU3SRSWug_8q22AVJ9";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const galeria = document.getElementById("galeria");
        const selectorFoto = document.getElementById("selectorFoto");
        const botonSubir = document.getElementById("botonSubir");

        function mostrarMensajeVacio() {
            if (galeria.querySelector(".foto")) return;

            galeria.innerHTML = `
                <div class="sin-fotos">
                    <span class="icono-camara">📸</span>
                    <div>Todavía no hay fotos.</div>
                    <div>¡Sé el primero en subir una!</div>
                </div>
            `;
        }

        function mostrarFoto(url) {
            const mensaje = galeria.querySelector(".sin-fotos");

            if (mensaje) {
                mensaje.remove();
            }

            const contenedor = document.createElement("div");
            contenedor.className = "foto";

            const imagen = document.createElement("img");
            imagen.src = url;
            imagen.alt = "Foto de los XV";
            imagen.loading = "lazy";

            imagen.addEventListener("error", () => {
                contenedor.remove();
                mostrarMensajeVacio();
            });

            imagen.addEventListener("click", () => {
                abrirFotoGrande(url);
            });

            contenedor.appendChild(imagen);
            galeria.appendChild(contenedor);
        }

        async function cargarFotos() {
            const { data, error } = await supabaseClient
                .storage
                .from("fotos")
                .list();

            if (error) {
                console.error("Error al cargar fotos:", error);
                return;
            }

            galeria.innerHTML = "";

            const archivos = (data || []).filter(archivo =>
                archivo.name &&
                archivo.id &&
                !archivo.name.endsWith("/")
            );

            if (archivos.length === 0) {
                mostrarMensajeVacio();
                return;
            }

            archivos.forEach(archivo => {
                const { data: urlData } = supabaseClient
                    .storage
                    .from("fotos")
                    .getPublicUrl(archivo.name);

                mostrarFoto(urlData.publicUrl);
            });
        }

        botonSubir.addEventListener("click", () => {
            selectorFoto.click();
        });

        selectorFoto.addEventListener("change", async () => {
            const archivo = selectorFoto.files[0];

            if (!archivo) return;

            if (!archivo.type.startsWith("image/")) {
                alert("Selecciona un archivo de imagen.");
                selectorFoto.value = "";
                return;
            }

            botonSubir.disabled = true;
            botonSubir.textContent = "Subiendo foto...";

            try {
                const extension = archivo.name.includes(".")
                    ? archivo.name.split(".").pop()
                    : "jpg";

                const nombreArchivo =
                    Date.now() + "-" +
                    Math.random().toString(36).slice(2) +
                    "." + extension;

                const { error: errorSubida } =
                    await supabaseClient
                        .storage
                        .from("fotos")
                        .upload(nombreArchivo, archivo, {
                            cacheControl: "3600",
                            upsert: false
                        });

                if (errorSubida) {
                    console.error("Error al subir:", errorSubida);
                    alert("No se pudo subir la foto.");
                    return;
                }

                await cargarFotos();
                alert("¡Foto subida! 💙");

            } catch (error) {
                console.error(error);
                alert("Ocurrió un error al subir la foto.");
            } finally {
                botonSubir.textContent = "+ Subir una foto";
                botonSubir.disabled = false;
                selectorFoto.value = "";
            }
        });

        function abrirFotoGrande(url) {
            const fondo = document.createElement("div");

            Object.assign(fondo.style, {
                position: "fixed",
                top: "0",
                left: "0",
                width: "100%",
                height: "100%",
                background: "rgba(0,0,0,0.9)",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                flexDirection: "column",
                zIndex: "9999",
                padding: "20px"
            });

            const imagenGrande = document.createElement("img");
            imagenGrande.src = url;

            Object.assign(imagenGrande.style, {
                maxWidth: "90%",
                maxHeight: "75vh",
                objectFit: "contain",
                borderRadius: "15px"
            });

            const descargar = document.createElement("button");
            descargar.textContent = "⬇ Descargar foto";

            Object.assign(descargar.style, {
                marginTop: "20px",
                padding: "12px 25px",
                borderRadius: "25px",
                background: "rgba(40,130,220,0.8)",
                color: "white",
                border: "none",
                fontSize: "16px",
                cursor: "pointer"
            });

            descargar.addEventListener("click", async () => {
                try {
                    descargar.textContent = "Descargando...";

                    const respuesta = await fetch(url);

                    if (!respuesta.ok) {
                        throw new Error("No se pudo descargar la imagen");
                    }

                    const blob = await respuesta.blob();
                    const urlBlob = URL.createObjectURL(blob);
                    const enlace = document.createElement("a");

                    enlace.href = urlBlob;
                    enlace.download = "foto-mis-xv.jpg";

                    document.body.appendChild(enlace);
                    enlace.click();
                    enlace.remove();

                    URL.revokeObjectURL(urlBlob);
                    descargar.textContent = "✓ Foto descargada";

                } catch (error) {
                    console.error("Error al descargar:", error);
                    descargar.textContent = "No se pudo descargar";
                }
            });

            const cerrar = document.createElement("button");
            cerrar.textContent = "✕ Cerrar";

            Object.assign(cerrar.style, {
                marginTop: "10px",
                padding: "8px 20px",
                border: "none",
                borderRadius: "20px",
                background: "rgba(255,255,255,0.2)",
                color: "white",
                cursor: "pointer"
            });

            cerrar.addEventListener("click", () => {
                fondo.remove();
            });

            fondo.addEventListener("click", evento => {
                if (evento.target === fondo) {
                    fondo.remove();
                }
            });

            fondo.appendChild(imagenGrande);
            fondo.appendChild(descargar);
            fondo.appendChild(cerrar);
            document.body.appendChild(fondo);
        }

        cargarFotos();

        setInterval(() => {
            cargarFotos();
        }, 5000);
    </script>

</body>
</html>
