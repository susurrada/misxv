<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis XV</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;

            background:
                linear-gradient(
                    rgba(5, 20, 45, 0.75),
                    rgba(5, 20, 45, 0.85)
                ),
                url("fondo.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            min-height: 100vh;

            animation: aparecer 0.8s ease;
        }

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        header {
            padding: 25px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid rgba(255, 255, 255, 0.15);

            background: rgba(0, 10, 30, 0.35);

            backdrop-filter: blur(8px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        nav {
            display: flex;
            gap: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;

            padding: 10px 18px;

            border-radius: 25px;

            transition: 0.3s;
        }

        nav a:hover {
            background: rgba(70, 160, 255, 0.35);

            box-shadow:
                0 0 15px rgba(80, 180, 255, 0.4);
        }

        .contenido {
            min-height: calc(100vh - 90px);

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 40px 20px;
        }

        .contenido h1 {
            font-size: 60px;

            margin: 0;

            letter-spacing: 5px;

            text-shadow:
                0 0 15px rgba(70, 180, 255, 0.8);
        }

        .contenido p {
            font-size: 20px;

            max-width: 600px;

            line-height: 1.6;

            color: #d9ecff;
        }

        .tarjetas {
            display: flex;

            gap: 20px;

            margin-top: 35px;

            flex-wrap: wrap;

            justify-content: center;
        }

        .tarjeta {
            width: 190px;

            padding: 25px 20px;

            border-radius: 20px;

            background: rgba(20, 80, 140, 0.25);

            border: 1px solid rgba(130, 200, 255, 0.3);

            backdrop-filter: blur(10px);

            transition: 0.3s;
        }

        .tarjeta:hover {
            transform: translateY(-7px);

            background: rgba(30, 110, 190, 0.4);

            box-shadow:
                0 0 25px rgba(60, 170, 255, 0.3);
        }

        .tarjeta h2 {
            margin-top: 0;

            font-size: 20px;
        }

        .tarjeta p {
            font-size: 14px;

            margin-bottom: 0;

            color: #d9ecff;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;

                gap: 20px;

                padding: 20px;
            }

            nav {
                flex-wrap: wrap;

                justify-content: center;
            }

            .contenido h1 {
                font-size: 42px;
            }

            .contenido p {
                font-size: 17px;
            }

        }
        .tarjeta {
    width: 190px;
    padding: 25px 20px;
    border-radius: 20px;

    background: rgba(20, 80, 140, 0.25);

    border: 1px solid rgba(130, 200, 255, 0.3);

    backdrop-filter: blur(10px);

    transition: 0.3s;

    text-decoration: none;
    color: white;
    display: block;
}

    </style>

</head>

<body>

    <header>

        <div class="logo">
            MIS XV
        </div>

        <nav>

            <a href="index.html">
                Inicio
            </a>

            <a href="galeria.html">
                Galería
            </a>

            <a href="mensajes.html">
                Mensajes
            </a>

        </nav>

    </header>


    <main class="contenido">

        <h1>Bienvenidos</h1>

        <p>
            Me hace mucha ilusión compartir este momento
            con las personas que quiero.
        </p>


        <div class="tarjetas">

            <a href="galeria.html" class="tarjeta">

    <h2>📸 Galería</h2>

    <p>
        Los recuerdos de esta noche.
    </p>

</a>


            <a href="mensajes.html" class="tarjeta">

                  <h2>💌 Mensajes</h2>

                <p>
                  Déjame un mensaje para recordar
                este día.
                </p>

</a>

            </div>

        </div>

    </main>

</body>

</html>
